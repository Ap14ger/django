<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>djago CRUD</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>


        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid">
            <a class="navbar-brand" href="/signin">Django App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li>
                        <!-- Este es un elemento de lista que contiene un enlace. -->
                        <a href="/" class="nav-link">Home</a>
                        <!-- El enlace lleva al usuario a la página principal del sitio ("/"). -->
                    </li>
        
                
                {% if user.is_authenticated %}
                    <!-- Si el usuario está autenticado (es decir, ha iniciado sesión), se muestra este bloque. -->
                    
                    <li class="nav-item">
                        <a href="{% url 'create_task' %}" class="nav-link" >Crear tareras</a>
                        <!-- El enlace lleva al usuario a la página de crear tareas ("/task"). -->
                    </li>
                    <li class="nav-item" >
                        <a href="/task" class="nav-link" >Tareas pendients</a>
                        <!-- El enlace lleva al usuario a la página de tareas ("/task"). -->
                    </li>
                    <li class="nav-item">
                        <a href="/task_completed" class="nav-link" >Tareas completadas</a>
                        <!-- El enlace lleva al usuario a la página de tareas ("/task"). -->
                    </li>
                
                    <li class="nav-item">
                        <a href="/logout" class="nav-link" >Cerrar sesion</a>
                        <!-- Este enlace lleva al usuario a la página de cierre de sesión ("/logout"). -->
                    </li>
                    {% else %}
                    <!-- Si el usuario no está autenticado (no ha iniciado sesión), se muestra este bloque alternativo. -->
                    <li class="nav-item">
                        <a href="/signup" class="nav-link" >Registrarse</a>
                        <!-- Este enlace lleva al usuario a la página de registro ("/signup"). -->
                    </li>
                    <li class="nav-item">
                        <a href="/signin" class="nav-link" >Login</a>
                        <!-- Este enlace lleva al usuario a la página de registro ("/signup"). -->
                    </li>
                    {% endif %}
                    <!-- Fin del bloque condicional que verifica si el usuario está autenticado. -->
                </ul>
            </div>
            </div>
        </nav>
        <!-- Aquí comienza el cuerpo del documento HTML. -->


    <!-- Fin de la barra de navegación. -->

    {% block content %}
    <!-- Este bloque es donde se insertará el contenido específico de cada página que herede esta plantilla. 
         El contenido de este bloque se define en las plantillas hijas. -->
    {% endblock %}
    <!-- Fin del bloque de contenido. -->

</body>
<!-- Fin del cuerpo del documento HTML. -->

</html>
