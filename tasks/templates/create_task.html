{% extends 'base.html' %} <!-- Hereda la estructura y estilos de la plantilla base.html -->

{% block content %} <!-- Define un bloque de contenido que se insertará en base.html -->

<main class="container">
    <div class="row mt-2">
        <div class="col-md-5 offset-md-4">
           
            <form action="/task/create/" method="POST" class="card card-body mt-4">
                <h1 class=" text-center">Crear tarea</h1> <!-- Título de la página -->

                {{ error }} <!-- Muestra un mensaje de error si existe algún problema al enviar el formulario -->
    
                <!-- Formulario que envía los datos a la ruta "/task/create/" usando el método POST -->
                {% csrf_token %} <!-- Token de seguridad para evitar ataques CSRF (Cross-Site Request Forgery) -->

                {{ form }} <!-- Renderiza automáticamente los campos del formulario pasado desde la vista -->

                <button class="btn btn-primary mt-3"> <!-- Botón para enviar el formulario -->
                    Guardar
                </button>
            </form>
        </div>
    </div>
</main>

{% endblock %} <!-- Cierra el bloque de contenido -->
